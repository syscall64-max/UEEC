name: UEEC benchmark correctness
on:
  push:
    paths: ['17_ueec_bench/**', '16_ueec_vm/**', '.github/workflows/ueec-bench.yml']
  pull_request:
    paths: ['17_ueec_bench/**', '16_ueec_vm/**', '.github/workflows/ueec-bench.yml']
permissions:
  contents: read
jobs:
  benchmark-correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check benchmark plumbing (no timing threshold)
        run: make -C 17_ueec_bench test
      - name: Check sanitizer build including leak detection
        run: make -C 17_ueec_bench sanitize ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
